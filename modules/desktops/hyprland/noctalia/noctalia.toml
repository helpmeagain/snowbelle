# Conferir mudanças cat ~/.local/state/noctalia/settings.toml

[bar.default]
background_opacity = 0.8
concave_edge_corners = false
end = [ "tray", "notifications", "network", "bluetooth", "volume", "battery" ]
margin_ends = 0
radius = 0
shadow = false
start = [ "workspaces" ]

[control_center]
hidden_tabs = [ "media", "weather", "calendar", "notifications", "screen-time" ]
sidebar_section = "none"

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen]
blurred_desktop = true

[shell]
corner_radius_scale = 0.65
polkit_agent = true

[shell.launcher]
categories = false
pinned = [ "firefox", "org.kde.dolphin", "com.mitchellh.ghostty", "codium" ]

[shell.screenshot]
confirm_region = true

[theme]
source = "wallpaper"

[theme.templates]
builtin_ids = [ "gtk3", "gtk4", "ghostty",  "hyprland", "kcolorscheme" ]

[wallpaper]
directory = "~/Imagens/Wallpapers"
transition = [ "fade" ]
transition_duration = 500

[weather]
enabled = false

[widget.clock]
format = "{:%d de %b  %H:%M}"

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.workspaces]
capsule = true
capsule_fill = "on_secondary"
capsule_opacity = 0.5
style = "minimal"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 300.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 600.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 350.0
