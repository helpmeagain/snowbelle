"$schema" = "https://starship.rs/config-schema.json"

add_newline = true

format = "$os$nix_shell$username$hostname(bg:#c099ff)[](fg:#c099ff bg:#585b70)$directory[](fg:#585b70 bg:#45475a)$git_branch$git_status[](fg:#45475a) "

[username]
show_always = false
style_user = "bg:#c099ff fg:#1e1e2e"
style_root = "bg:#f38ba8 fg:#1e1e2e"
format = "[ $user](bold $style)"

[hostname]
ssh_only = true
style = "bg:#c099ff fg:#1e1e2e"
format = "[@$hostname](bold $style)"
disabled = false

[os]
disabled = false
style = "bg:#c099ff fg:#1e1e2e"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
Kali = ""
NixOS = ""

[nix_shell]
disabled = false
style = "bg:#c099ff fg:#1e1e2e"
format = "[\\( $name\\)](bold $style)"
impure_msg = "impure"
pure_msg = "pure"
unknown_msg = ""

[directory]
style = "fg:#cdd6f4 bg:#585b70"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#45475a"
format = '[[ $symbol $branch ](fg:#cba6f7 bg:#45475a)]($style)'

[git_status]
style = "bg:#45475a"
format = '[[($all_status$ahead_behind )](fg:#f9e2af bg:#45475a)]($style)'

[nodejs]
symbol = ""
style = "bg:#313244"
format = "[[ $symbol ($version) ](fg:#a6e3a1 bg:#313244)]($style)"

[rust]
symbol = ""
style = "bg:#313244"
format = "[[ $symbol ($version) ](fg:#fab387 bg:#313244)]($style)"

[golang]
symbol = ""
style = "bg:#313244"
format = "[[ $symbol ($version) ](fg:#89dceb bg:#313244)]($style)"

[php]
symbol = ""
style = "bg:#313244"
format = "[[ $symbol ($version) ](fg:#b4befe bg:#313244)]($style)"

[time]
disabled = true
time_format = "%R"
style = "bg:#1e1e2e"
format = "[[ $time ](fg:#6c7086 bg:#1e1e2e)]($style)"

[env_var.NIX_SHELL_CLI]
style = "bg:#c099ff fg:#1e1e2e"
format = "[\\(  nix shell\\)](bold $style)"
