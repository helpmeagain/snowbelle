theme = "tokyonight-transparent"

[editor]
true-color = true

[editor.statusline]
separator = " "
left   = ["mode", "file-name", "file-modification-indicator", "version-control"]
center = []
right  = ["diagnostics", "selections", "position"]

[editor.statusline.mode]
normal = "Normal"
insert = "Insert"
select = "Select"